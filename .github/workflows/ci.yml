name: Python CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Run all tester scripts under tester / manual_tester / auto_tester
        env:
          MPLBACKEND: Agg
        shell: bash
        run: |
          set -euo pipefail
          chmod +x libmoon/auto_tester/test_synthetic.sh
          libmoon/auto_tester/test_synthetic.sh
          chmod +x libmoon/manual_tester/run_mtl_discrete.sh
          libmoon/manual_tester/run_mtl_discrete.sh
          chmod +x libmoon/manual_tester/run_mtl_psl.sh
          libmoon/manual_tester/run_mtl_psl.sh
          chmod +x libmoon/manual_tester/run_syn_discrete.sh
          libmoon/manual_tester/run_syn_discrete.sh
          chmod +x libmoon/solver/mobo/tester/run_mobo.sh
          libmoon/solver/mobo/tester/run_mobo.sh